services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sindh_agents
      - POSTGRES_PASSWORD=sindh_agents
      - POSTGRES_DB=sindh_agents_dev
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sindh_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../apps/backend
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - BACKEND_HOST=0.0.0.0
      - DATABASE_URL=postgresql+asyncpg://sindh_agents:sindh_agents@db:5432/sindh_agents_dev
      - DATABASE_URL_SYNC=postgresql://sindh_agents:sindh_agents@db:5432/sindh_agents_dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../apps/backend/src:/app/src
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 8000

  web:
    build: ../apps/web
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
      - BACKEND_PUBLIC_URL=http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  db_data:
