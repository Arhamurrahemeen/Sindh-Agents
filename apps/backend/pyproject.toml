[project]
name = "sindh-agents-backend"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.5",
    "pydantic==2.8.2",
    "pydantic-settings==2.4.0",
    "sqlalchemy==2.0.32",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",
    "twilio==9.10.9",
    "groq==1.5.0",
    "cohere==7.0.8",
    "qdrant-client==1.18.0",
    "openpyxl==3.1.5",
    "python-multipart==0.0.9",
    "tzdata==2024.1",
    # transitive via qdrant-client/cohere, never imported directly — pinned
    # explicitly because unpinned resolution picks up numpy>=2.4's stubs,
    # which mypy can't parse (PEP 695 type-statement syntax in .pyi files).
    "numpy==2.1.3",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "ruff==0.5.6",
    "black==24.8.0",
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "httpx==0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "seeds*"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "twilio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
