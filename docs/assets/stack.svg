<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Sindh Agents stack — Next.js frontend, FastAPI backend, deterministic tools, Groq LLM, Neon Postgres and Qdrant">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#EDE7D8"/>
    </linearGradient>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#04342C" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="url(#sbg)"/>

  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="4" height="26" rx="2" fill="#1D9E75"/>
    <text x="14" y="19" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="600" fill="#04342C">The stack</text>
    <text x="14" y="42" font-family="ui-sans-serif, system-ui" font-size="13" fill="#5F5E5A">Every layer chosen because we've shipped it before — no bootcamp tech in production.</text>
  </g>

  <!-- Layer 1: Frontend -->
  <g transform="translate(48, 110)" filter="url(#cs)">
    <rect width="1104" height="70" rx="12" fill="#FFFFFF" stroke="#E7E4DA"/>
    <rect width="6" height="70" rx="3" fill="#1D9E75"/>
    <text x="24" y="26" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8A8880" letter-spacing="0.06em">01 · FRONTEND · Ayesha</text>
    <text x="24" y="50" font-family="ui-sans-serif, system-ui" font-size="14" fill="#2C2C2A" font-weight="500">Next.js 14 · TypeScript · Tailwind · shadcn/ui</text>
    <g font-family="ui-sans-serif, system-ui" font-size="12">
      <rect x="500" y="24" width="120" height="26" rx="13" fill="#E1F5EE" stroke="#9FE1CB"/>
      <text x="560" y="41" fill="#04342C" text-anchor="middle">SSR + RSC</text>
      <rect x="628" y="24" width="130" height="26" rx="13" fill="#E1F5EE" stroke="#9FE1CB"/>
      <text x="693" y="41" fill="#04342C" text-anchor="middle">TanStack Query</text>
      <rect x="766" y="24" width="98" height="26" rx="13" fill="#E1F5EE" stroke="#9FE1CB"/>
      <text x="815" y="41" fill="#04342C" text-anchor="middle">Phone OTP</text>
    </g>
    <text x="1088" y="42" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8A8880" text-anchor="end">:3000</text>
  </g>

  <!-- connector -->
  <g stroke="#9FE1CB" stroke-width="1.5" fill="none">
    <path d="M600 180 L600 200"/>
  </g>

  <!-- Layer 2: Backend -->
  <g transform="translate(48, 200)" filter="url(#cs)">
    <rect width="1104" height="70" rx="12" fill="#FFFFFF" stroke="#E7E4DA"/>
    <rect width="6" height="70" rx="3" fill="#085041"/>
    <text x="24" y="26" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8A8880" letter-spacing="0.06em">02 · BACKEND · Arham</text>
    <text x="24" y="50" font-family="ui-sans-serif, system-ui" font-size="14" fill="#2C2C2A" font-weight="500">FastAPI · Python 3.11 (pinned) · SQLAlchemy async · Alembic</text>
    <g font-family="ui-sans-serif, system-ui" font-size="12">
      <rect x="500" y="24" width="130" height="26" rx="13" fill="#04342C"/>
      <text x="565" y="41" fill="#E1F5EE" text-anchor="middle">Orchestrator</text>
      <rect x="638" y="24" width="120" height="26" rx="13" fill="#04342C"/>
      <text x="698" y="41" fill="#E1F5EE" text-anchor="middle">MCP-shaped</text>
      <rect x="766" y="24" width="98" height="26" rx="13" fill="#04342C"/>
      <text x="815" y="41" fill="#E1F5EE" text-anchor="middle">Twilio</text>
    </g>
    <text x="1088" y="42" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8A8880" text-anchor="end">:8000</text>
  </g>

  <!-- connector -->
  <g stroke="#9FE1CB" stroke-width="1.5" fill="none">
    <path d="M280 270 L280 300"/>
    <path d="M600 270 L600 300"/>
    <path d="M920 270 L920 300"/>
  </g>

  <!-- Layer 3: three columns (Data, LLM, Comms) -->
  <g transform="translate(48, 300)">
    <!-- Data -->
    <g filter="url(#cs)">
      <rect width="352" height="140" rx="12" fill="#FFFFFF" stroke="#E7E4DA"/>
      <rect width="6" height="140" rx="3" fill="#1D9E75"/>
      <text x="24" y="26" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8A8880" letter-spacing="0.06em">03 · DATA</text>
      <text x="24" y="50" font-family="ui-sans-serif, system-ui" font-size="14" fill="#2C2C2A" font-weight="500">Source of truth</text>

      <g font-family="ui-sans-serif, system-ui" font-size="12">
        <rect x="24" y="68" width="152" height="26" rx="6" fill="#F5F1E8" stroke="#E7E4DA"/>
        <text x="34" y="85" fill="#04342C">Neon · Postgres 16</text>

        <rect x="184" y="68" width="132" height="26" rx="6" fill="#F5F1E8" stroke="#E7E4DA"/>
        <text x="194" y="85" fill="#04342C">Qdrant Cloud</text>

        <rect x="24" y="100" width="292" height="26" rx="6" fill="#F5F1E8" stroke="#E7E4DA"/>
        <text x="34" y="117" fill="#04342C">Excel · pandas · AES-256 at rest</text>
      </g>
    </g>

    <!-- LLM -->
    <g transform="translate(376, 0)" filter="url(#cs)">
      <rect width="352" height="140" rx="12" fill="#FFFFFF" stroke="#C7C3F0"/>
      <rect width="6" height="140" rx="3" fill="#26215C"/>
      <text x="24" y="26" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8A8880" letter-spacing="0.06em">04 · LLM · narration only</text>
      <text x="24" y="50" font-family="ui-sans-serif, system-ui" font-size="14" fill="#2C2C2A" font-weight="500">Groq · Llama 3.3 70B</text>

      <g font-family="ui-sans-serif, system-ui" font-size="12">
        <rect x="24" y="68" width="132" height="26" rx="6" fill="#EEEDFE"/>
        <text x="34" y="85" fill="#26215C">Sub-second latency</text>

        <rect x="164" y="68" width="152" height="26" rx="6" fill="#EEEDFE"/>
        <text x="174" y="85" fill="#26215C">Cohere · rerank / embed</text>

        <rect x="24" y="100" width="292" height="26" rx="6" fill="#EEEDFE"/>
        <text x="34" y="117" fill="#26215C">Prompt: "never change a number"</text>
      </g>
    </g>

    <!-- Comms -->
    <g transform="translate(752, 0)" filter="url(#cs)">
      <rect width="352" height="140" rx="12" fill="#FFFFFF" stroke="#E7E4DA"/>
      <rect width="6" height="140" rx="3" fill="#085041"/>
      <text x="24" y="26" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8A8880" letter-spacing="0.06em">05 · MESSAGING</text>
      <text x="24" y="50" font-family="ui-sans-serif, system-ui" font-size="14" fill="#2C2C2A" font-weight="500">Widget now · WhatsApp on Phase 2 flip</text>

      <g font-family="ui-sans-serif, system-ui" font-size="12">
        <rect x="24" y="68" width="152" height="26" rx="6" fill="#F5F1E8" stroke="#E7E4DA"/>
        <text x="34" y="85" fill="#04342C">Twilio · WA Business API</text>

        <rect x="184" y="68" width="132" height="26" rx="6" fill="#F5F1E8" stroke="#E7E4DA"/>
        <text x="194" y="85" fill="#04342C">Widget mock</text>

        <rect x="24" y="100" width="292" height="26" rx="6" fill="#F5F1E8" stroke="#E7E4DA"/>
        <text x="34" y="117" fill="#04342C">Same webhook contract on both</text>
      </g>
    </g>
  </g>

  <!-- footer -->
  <g transform="translate(48, 460)">
    <rect x="0" y="0" width="1104" height="42" rx="10" fill="#04342C"/>
    <text x="20" y="18" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9FE1CB" letter-spacing="0.06em">DEPLOY</text>
    <text x="20" y="34" font-family="ui-sans-serif, system-ui" font-size="13" fill="#E1F5EE">Docker Compose · Caddy TLS · single-node · db on :5433 · backend on :8000 · web on :3000</text>
  </g>
</svg>
