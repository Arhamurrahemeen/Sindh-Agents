<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Phase timeline P0 through P6 — foundations, auth, widget, agent, dashboard, eval, WhatsApp flip">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#EDE7D8"/>
    </linearGradient>
    <filter id="pcs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#04342C" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="340" fill="url(#pbg)"/>

  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="4" height="26" rx="2" fill="#1D9E75"/>
    <text x="14" y="19" font-family="ui-sans-serif, system-ui" font-size="20" font-weight="600" fill="#04342C">Phase plan · seven shipped-when gates</text>
    <text x="14" y="42" font-family="ui-sans-serif, system-ui" font-size="13" fill="#5F5E5A">Every gate is user-visible. "The backend compiles" is not a gate. "You can see X happen" is.</text>
  </g>

  <!-- rail -->
  <line x1="90" y1="200" x2="1150" y2="200" stroke="#9FE1CB" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="200" x2="700" y2="200" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>

  <!-- phase nodes -->
  <g font-family="ui-sans-serif, system-ui">
    <!-- P0 shipped -->
    <g transform="translate(90, 200)">
      <circle r="14" fill="#1D9E75" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="-30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#04342C">P0</text>
      <text y="42" text-anchor="middle" font-size="11" fill="#2C2C2A" font-weight="500">Foundations</text>
      <text y="58" text-anchor="middle" font-size="10" fill="#5F5E5A">/health · migrations</text>
    </g>

    <!-- P1 shipped -->
    <g transform="translate(240, 200)">
      <circle r="14" fill="#1D9E75" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="-30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#04342C">P1</text>
      <text y="42" text-anchor="middle" font-size="11" fill="#2C2C2A" font-weight="500">Auth + shell</text>
      <text y="58" text-anchor="middle" font-size="10" fill="#5F5E5A">OTP login · empty dash</text>
    </g>

    <!-- P2 shipped -->
    <g transform="translate(400, 200)">
      <circle r="14" fill="#1D9E75" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="-30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#04342C">P2</text>
      <text y="42" text-anchor="middle" font-size="11" fill="#2C2C2A" font-weight="500">Widget + ingest</text>
      <text y="58" text-anchor="middle" font-size="10" fill="#5F5E5A">unread convo lands</text>
    </g>

    <!-- P3 shipped -->
    <g transform="translate(560, 200)">
      <circle r="14" fill="#1D9E75" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M-5 0 L-1 4 L6 -4" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="-30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#04342C">P3</text>
      <text y="42" text-anchor="middle" font-size="11" fill="#2C2C2A" font-weight="500">Agent loop</text>
      <text y="58" text-anchor="middle" font-size="10" fill="#5F5E5A">"denim kitni hai"</text>
    </g>

    <!-- P4 in progress -->
    <g transform="translate(720, 200)">
      <circle r="16" fill="#FFFFFF" stroke="#1D9E75" stroke-width="3"/>
      <circle r="6" fill="#1D9E75"/>
      <text y="-30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#04342C">P4 · now</text>
      <text y="42" text-anchor="middle" font-size="11" fill="#2C2C2A" font-weight="500">Dashboard views</text>
      <text y="58" text-anchor="middle" font-size="10" fill="#5F5E5A">audit drawer · analytics</text>
    </g>

    <!-- P5 pending -->
    <g transform="translate(880, 200)">
      <circle r="14" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="2"/>
      <text y="-30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="500" fill="#5F5E5A">P5</text>
      <text y="42" text-anchor="middle" font-size="11" fill="#5F5E5A" font-weight="500">Eval + polish</text>
      <text y="58" text-anchor="middle" font-size="10" fill="#8A8880">30-query · ≥80%</text>
    </g>

    <!-- P6 optional -->
    <g transform="translate(1050, 200)">
      <circle r="14" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="2" stroke-dasharray="3 3"/>
      <text y="-30" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="500" fill="#5F5E5A">P6</text>
      <text y="42" text-anchor="middle" font-size="11" fill="#5F5E5A" font-weight="500">WhatsApp flip</text>
      <text y="58" text-anchor="middle" font-size="10" fill="#8A8880">demo-day · optional</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(48, 288)" font-family="ui-sans-serif, system-ui" font-size="11" fill="#5F5E5A">
    <circle cx="8" cy="8" r="6" fill="#1D9E75"/>
    <text x="22" y="12">shipped</text>

    <circle cx="98" cy="8" r="7" fill="#FFFFFF" stroke="#1D9E75" stroke-width="2"/>
    <circle cx="98" cy="8" r="3" fill="#1D9E75"/>
    <text x="112" y="12">in progress</text>

    <circle cx="212" cy="8" r="6" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="2"/>
    <text x="226" y="12">pending</text>

    <circle cx="292" cy="8" r="6" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="306" y="12">optional</text>

    <text x="1150" y="12" text-anchor="end" font-family="ui-monospace, Menlo, monospace" fill="#8A8880">master plan · phase/MVP_v1.md</text>
  </g>
</svg>
