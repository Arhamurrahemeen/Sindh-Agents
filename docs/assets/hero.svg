<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Sindh Agents — an AI employee that reads your Excel, remembers your buyers, replies on WhatsApp in Roman Urdu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="1" stop-color="#EDE7D8"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D9E75"/>
      <stop offset="1" stop-color="#085041"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#04342C" opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#04342C" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>

  <!-- top status bar -->
  <g transform="translate(48, 34)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#9FE1CB" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#1D9E75"/>
    <text x="28" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#04342C" font-weight="500">KSBL ELXR '26</text>

    <rect x="162" y="0" width="118" height="28" rx="14" fill="#04342C"/>
    <text x="178" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#E1F5EE" font-weight="500">phase / P4</text>
  </g>

  <!-- SA mark -->
  <g transform="translate(48, 90)" filter="url(#soft)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#emerald)"/>
    <text x="32" y="44" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">SA</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(130, 100)">
    <text x="0" y="42" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="52" font-weight="700" fill="#04342C" letter-spacing="-1.5">Sindh Agents</text>
    <text x="0" y="76" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="17" font-weight="400" fill="#5F5E5A">An AI employee for Pakistani SMEs — WhatsApp, Excel, Roman Urdu.</text>
  </g>

  <!-- tagline strip -->
  <g transform="translate(48, 240)">
    <rect x="0" y="0" width="620" height="46" rx="10" fill="#FFFFFF" stroke="#E7E4DA" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="46" rx="2" fill="#1D9E75"/>
    <text x="18" y="30" font-family="ui-sans-serif, system-ui, -apple-system" font-size="15" fill="#2C2C2A" font-weight="500">Foreign software wasn't built for Pakistan.</text>
    <text x="410" y="30" font-family="ui-sans-serif, system-ui, -apple-system" font-size="15" fill="#1D9E75" font-weight="600">We are.</text>
  </g>

  <!-- pill row -->
  <g transform="translate(48, 306)" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="500">
    <g>
      <rect x="0" y="0" width="118" height="26" rx="13" fill="#E1F5EE" stroke="#9FE1CB"/>
      <text x="59" y="17" fill="#04342C" text-anchor="middle">Deterministic</text>
    </g>
    <g transform="translate(128, 0)">
      <rect width="98" height="26" rx="13" fill="#E1F5EE" stroke="#9FE1CB"/>
      <text x="49" y="17" fill="#04342C" text-anchor="middle">Auditable</text>
    </g>
    <g transform="translate(236, 0)">
      <rect width="128" height="26" rx="13" fill="#E1F5EE" stroke="#9FE1CB"/>
      <text x="64" y="17" fill="#04342C" text-anchor="middle">Roman Urdu first</text>
    </g>
    <g transform="translate(374, 0)">
      <rect width="132" height="26" rx="13" fill="#EEEDFE" stroke="#C7C3F0"/>
      <text x="66" y="17" fill="#26215C" text-anchor="middle">Groq · Llama 3.3</text>
    </g>
    <g transform="translate(516, 0)">
      <rect width="98" height="26" rx="13" fill="#FFFFFF" stroke="#E7E4DA"/>
      <text x="49" y="17" fill="#5F5E5A" text-anchor="middle">MCP-shaped</text>
    </g>
  </g>

  <!-- right side: WhatsApp bubble motif -->
  <g transform="translate(760, 70)" filter="url(#soft)">
    <!-- phone frame -->
    <rect x="0" y="0" width="380" height="260" rx="18" fill="#FFFFFF" stroke="#E7E4DA"/>

    <!-- convo header -->
    <rect x="0" y="0" width="380" height="46" rx="18" fill="#085041"/>
    <rect x="0" y="20" width="380" height="26" fill="#085041"/>
    <circle cx="30" cy="23" r="14" fill="#FFFFFF"/>
    <text x="30" y="27" font-family="ui-sans-serif, system-ui" font-size="10" font-weight="700" fill="#085041" text-anchor="middle">SA</text>
    <text x="54" y="21" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="500" fill="#FFFFFF">Aslam Textiles</text>
    <circle cx="54" cy="34" r="3" fill="#C0DD97"/>
    <text x="63" y="37" font-family="ui-sans-serif, system-ui" font-size="10" fill="#C0DD97">Online</text>

    <!-- chat area -->
    <rect x="0" y="46" width="380" height="214" fill="#F1EFE8"/>

    <!-- incoming bubble -->
    <g transform="translate(14, 62)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#FFFFFF"/>
      <text x="12" y="21" font-family="ui-sans-serif, system-ui" font-size="12" fill="#2C2C2A">bhai denim kitni hai — 200 chahiye</text>
    </g>

    <!-- outgoing (agent) bubble -->
    <g transform="translate(60, 110)">
      <rect x="0" y="0" width="306" height="60" rx="8" fill="#DCF8C6"/>
      <text x="12" y="20" font-family="ui-sans-serif, system-ui" font-size="12" fill="#2C2C2A">Bhai, denim <tspan font-weight="600">450 pieces</tspan> hain. Rate:</text>
      <text x="12" y="36" font-family="ui-sans-serif, system-ui" font-size="12" fill="#2C2C2A"><tspan font-weight="600">Rs. 1,200/piece</tspan>. Kal delivery ho jaayegi.</text>
      <text x="294" y="52" font-family="ui-sans-serif, system-ui" font-size="9" fill="#5F5E5A" text-anchor="end">10:12 AM ✓✓</text>
    </g>

    <!-- audit trail badge under bubble -->
    <g transform="translate(60, 182)">
      <rect x="0" y="0" width="180" height="22" rx="11" fill="#FFFFFF" stroke="#9FE1CB"/>
      <circle cx="14" cy="11" r="4" fill="#1D9E75"/>
      <text x="26" y="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#04342C">audit · row #a1b2c3</text>
    </g>

    <!-- input strip -->
    <rect x="0" y="220" width="380" height="40" fill="#FFFFFF"/>
    <rect x="14" y="230" width="308" height="22" rx="11" fill="#F1EFE8"/>
    <text x="24" y="245" font-family="ui-sans-serif, system-ui" font-size="11" fill="#8A8880">Message likhein…</text>
    <circle cx="344" cy="241" r="14" fill="#085041"/>
    <path d="M338 241 L350 241 M346 237 L350 241 L346 245" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- corner attribution -->
  <text x="1152" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8A8880" text-anchor="end">github.com / sindh-agents</text>
</svg>
